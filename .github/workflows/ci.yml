name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: findash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # Service-container Postgres — database name contains "test" because
      # tests/setup.ts hard-fails otherwise (see backend/tests/setup.ts).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/findash_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/findash_test
      # Dummy values only — app.ts exits at startup if any of these are unset.
      # None of these are real credentials.
      PLAID_CLIENT_ID: test-plaid-client-id
      PLAID_SECRET: test-plaid-secret
      PLAID_ENV: sandbox
      ENCRYPTION_KEY: abababababababababababababababababababababababababababababababab
      # A dummy, not ENCRYPTION_KEY: lib/auditKey.ts refuses the two being equal.
      AUDIT_HASH_KEY: cdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcd
      CLERK_SECRET_KEY: sk_test_dummy_ci
      CLERK_PUBLISHABLE_KEY: pk_test_dummy_ci
      WEBHOOK_URL: http://localhost:3001/webhook

    steps:
      - uses: actions/checkout@v7

      # The Node major production runs (Railway reads backend/package.json's
      # engines); .nvmrc is the one place CI takes it from.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      - run: npx prisma migrate deploy

      - run: npm run typecheck

      - run: npm test

  # Notebooks are committed with outputs cleared: a saved output in this repo
  # is a query result from a real database, and the repo is public.
  notebooks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - run: python3 .github/scripts/check-notebook-outputs.py

  # Real users' ids and dated amounts never belong in a committed file. Prints
  # path, line and kind only, so a real hit doesn't land in a public log.
  personal-data:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - run: python3 .github/scripts/check-personal-data.py

  # M7.2 — before this job, a frontend-only break (type error, lint error that
  # fails the CRA build, or a URL-param regression) passed CI.
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      # The same Node as the backend and Vercel's build (frontend/package.json's
      # engines). Both repro scripts import .ts files directly and rely on
      # Node's built-in TypeScript type stripping, on by default from 22.18.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly the lockfile; frontend/.npmrc's
      # legacy-peer-deps only matters for `npm install`.
      - run: npm ci

      - run: npm run typecheck

      # Component tests: react-scripts' bundled Jest and jsdom, no extra dependencies.
      - name: Component tests
        run: npm test
        env:
          CI: "true"

      # CI=true makes react-scripts treat ESLint warnings (including the
      # no-restricted-imports rule on useSearchParams) as build errors.
      - name: Build (CI=true)
        run: npm run build
        env:
          CI: "true"

      - name: Repro — URL search-param writer race
        run: npm run repro:url-params

      - name: Repro — nav links keep ?demo=1
        run: npm run repro:link-nav

  # The daily backup job (backup/, M7.7): shellcheck, then the image builds
  # and carries the tools it needs. The end-to-end harness
  # (backup/test/harness.mjs) needs the local dev database, so it's run by hand.
  backup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      # A pinned shellcheck, the same one docs/backups.md uses locally: the
      # runner's packaged one is older and reports differently.
      - name: shellcheck
        run: docker run --rm -v "$PWD/backup:/mnt:ro" koalaman/shellcheck:v0.11.0 -s sh /mnt/run.sh /mnt/restore.sh

      - name: Build the image
        run: docker build -f backup/Dockerfile -t ledger-backup:ci .

      - name: The tools are there, and it runs as nobody
        run: |
          docker run --rm --entrypoint sh ledger-backup:ci -c 'pg_dump --version | grep -q "PostgreSQL) 17\." && age --version && rclone version >/dev/null && curl --version >/dev/null && [ "$(id -un)" = nobody ]'

      - name: With nothing set, it refuses and names what's missing
        run: |
          out=$(docker run --rm ledger-backup:ci 2>&1) && { echo "expected a failure"; exit 1; } || true
          echo "$out"
          echo "$out" | grep -q "missing required variables: BACKUP_DATABASE_URL BACKUP_AGE_RECIPIENT R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET SENTRY_DSN"
