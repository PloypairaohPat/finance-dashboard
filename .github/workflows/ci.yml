name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: findash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # Service-container Postgres — database name contains "test" because
      # tests/setup.ts hard-fails otherwise (see backend/tests/setup.ts).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/findash_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/findash_test
      # Dummy values only — app.ts exits at startup if any of these are unset.
      # None of these are real credentials.
      PLAID_CLIENT_ID: test-plaid-client-id
      PLAID_SECRET: test-plaid-secret
      PLAID_ENV: sandbox
      ENCRYPTION_KEY: abababababababababababababababababababababababababababababababab
      CLERK_SECRET_KEY: sk_test_dummy_ci
      CLERK_PUBLISHABLE_KEY: pk_test_dummy_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      - run: npx prisma migrate deploy

      - run: npm run typecheck

      - run: npm test
